name: Sondeo de fuentes (temporal)
on:
  push:
    branches: [claude/sondeo-fuentes]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pandas openpyxl xlrd playwright && python -m playwright install --with-deps chromium
      - run: python sondeo/probe.py
