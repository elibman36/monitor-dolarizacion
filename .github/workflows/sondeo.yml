name: Sondeo de fuentes (temporal)
on:
  push:
    branches: [claude/sondeo-fuentes]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pandas openpyxl xlrd
      - run: timeout 600 python -u sondeo/probe.py
