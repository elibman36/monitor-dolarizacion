name: Reporte semanal (PDF)

on:
  schedule:
    # Lunes 07:47 hora Argentina (UTC-3): informa la semana hábil anterior.
    - cron: "47 10 * * 1"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha de referencia AAAA-MM-DD (se informa la semana anterior). Vacío = hoy."
        required: false

permissions:
  contents: write

concurrency:
  group: monitor-dolarizacion
  cancel-in-progress: false

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-reporte.txt

      - name: Instalar dependencias
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter
          pip install -r requirements-reporte.txt pytest
          python -m playwright install --with-deps chromium

      - name: Tests
        run: python -m pytest -q

      - name: Actualizar datos
        run: |
          python -m monitor.build
          python -m monitor.peru || echo "Perú: no se pudo actualizar; uso los datos guardados"
          BCU_SSL_VERIFY=0 python -m monitor.uruguay || echo "Uruguay: no se pudo actualizar; uso los datos guardados"
          for M in brasil chile colombia; do python -m monitor.$M || echo "$M: no se pudo actualizar"; done

      - name: Generar el PDF
        run: |
          FECHA="${{ github.event.inputs.fecha }}"
          for PAIS in ar pe uy br cl co; do
            if [ -n "$FECHA" ]; then
              python -m monitor.report --pais "$PAIS" --fecha "$FECHA"
            else
              python -m monitor.report --pais "$PAIS"
            fi
          done

      - name: Guardar el PDF como artefacto de la corrida
        uses: actions/upload-artifact@v4
        with:
          name: reporte-semanal
          path: |
            reportes/*.pdf
            reportes/pe/*.pdf
            reportes/uy/*.pdf
            reportes/br/*.pdf
            reportes/cl/*.pdf
            reportes/co/*.pdf

      - name: Publicar en el repositorio
        run: |
          git config user.name "monitor-dolarizacion[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reportes
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Reporte semanal: $(ls -t reportes/reporte-semanal-*.pdf | head -1 | xargs basename)"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push
          fi
