name: Diagnóstico (temporal)

# Temporal: imprime en el log el texto de la planilla de reservas del BCRA y
# los desembolsos del FMI, para armar el gráfico de reservas netas. Se borra
# después de usarlo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Programa con el FMI
        run: |
          python - <<'PY'
          from monitor import sources
          for f in ["2025-03-31", "2025-04-30", "2025-08-31", "2026-03-31", "2026-09-30"]:
              try:
                  print(f, sources.fmi_programa_girado(f))
              except Exception as e:
                  print(f, "ERROR", e)
          import re, requests
          r = sources._session.get("https://www.imf.org/external/np/fin/data/rms_mth.aspx", params={"SelectDate": "2026-09-30", "reportType": "CVSDR"}, timeout=60)
          t = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", r.text))
          i = t.find("U.S. dollar"); print(r.status_code, t[max(0, i - 300):i + 400])
          PY
