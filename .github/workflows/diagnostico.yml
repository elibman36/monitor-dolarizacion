name: Diagnóstico (temporal)

# Temporal: imprime en el log el texto de la planilla de reservas del BCRA y
# los desembolsos del FMI, para armar el gráfico de reservas netas. Se borra
# después de usarlo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Planilla de reservas
        run: |
          python - <<'PY'
          import io, pdfplumber
          from monitor import sources
          for mm, yy in [("09", "26"), ("03", "25"), ("12", "23")]:
              url = f"https://www.bcra.gob.ar/archivos/Pdfs/PublicacionesEstadisticas/temp{mm}{yy}.pdf"
              r = sources._session.get(url, timeout=60, verify=sources._bcra_verify(), headers={"Accept": "*/*"})
              print("=" * 30, url, r.status_code)
              if r.content.startswith(b"%PDF"):
                  with pdfplumber.open(io.BytesIO(r.content)) as pdf:
                      print("\n".join((p.extract_text() or "") for p in pdf.pages))
          PY
      - name: Desembolsos del FMI
        run: |
          curl -sSL --max-time 60 "https://www.imf.org/external/np/fin/tad/extrans1.aspx?memberKey1=30&endDate=2099-12-31&finposition_flag=YES" \
            | python -c "import sys,re,html; t=re.sub(r'<[^>]+>',' ',sys.stdin.read()); t=html.unescape(re.sub(r'\s+',' ',t)); i=t.find('Disbursements'); print(t[:200]); print(t[max(0,i-500):i+6000])" || true
          curl -sSL --max-time 60 "https://www.imf.org/external/np/fin/tad/extarr2.aspx?memberKey1=30&date1key=2099-12-31" \
            | python -c "import sys,re,html; t=re.sub(r'<[^>]+>',' ',sys.stdin.read()); t=html.unescape(re.sub(r'\s+',' ',t)); print(t[:8000])" || true
